name: Validar Planilhas (Power BI Gate)

on:
  push:
    paths:
      - '**.xlsx'
      - '**.xls'
      - '**.csv'
      - 'validador_planilhas.py'
      - 'tratador_planilhas.py'
      - 'nomes_colunas.py'
      - 'config.json'
  pull_request:
    paths:
      - '**.xlsx'
      - '**.xls'
      - '**.csv'
      - 'validador_planilhas.py'
      - 'tratador_planilhas.py'
      - 'nomes_colunas.py'
      - 'config.json'
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------
  # ADICIONADO: o repositório tem 32 testes (test_validador.py) que nunca
  # rodavam automaticamente — só se alguém lembrasse de rodar `pytest` na
  # mão. Uma mudança em validador_planilhas.py/tratador_planilhas.py podia
  # quebrar algo e passar batido, já que o job de baixo só valida DADOS
  # (planilhas), não o código. Roda em toda mudança de código, mesmo sem
  # nenhuma planilha envolvida.
  # ---------------------------------------------------------------------
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar Dependências (com extras de dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Rodar Suíte de Testes
        run: pytest test_validador.py -v

      - name: Lint (ruff)
        run: ruff check .

  # ---------------------------------------------------------------------
  # CORRIGIDO: a versão anterior sempre validava um caminho fixo
  # (dados/entrada.xlsx), desconectado do que o gatilho (paths: **.xlsx,
  # **.xls, **.csv) realmente promete cobrir — qualquer planilha alterada
  # em qualquer lugar do repo. Se alguém commitasse uma planilha em outra
  # pasta (ou o arquivo fixo não existisse), o job falhava por "arquivo
  # não encontrado" mesmo sem nada de errado com os dados, ou pior:
  # validava sempre o mesmo arquivo e ignorava silenciosamente qualquer
  # outra planilha realmente alterada. Agora descobre dinamicamente os
  # arquivos de planilha alterados no push/PR e valida cada um.
  # ---------------------------------------------------------------------
  validar-dados:
    runs-on: ubuntu-latest
    needs: testes

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # necessário para git diff comparar com o commit anterior

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar Dependências
        # CORRIGIDO: instala a partir do pyproject.toml (pip install -e .)
        # em vez de uma lista manual separada de pacotes. A lista manual
        # anterior (pandas + openpyxl) já estava desatualizada em relação
        # ao pyproject.toml real do projeto — faltava xlrd (necessário
        # para .xls, que este workflow inclusive dispara ao mudar), e
        # ficaria defasada de novo a cada nova dependência adicionada no
        # projeto sem alguém lembrar de espelhar aqui também.
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Descobrir Planilhas Alteradas
        id: arquivos
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            # Em push, github.event.before é 0000...0 no primeiro push de
            # uma branch nova; nesse caso, compara contra a árvore vazia.
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
              BASE=$(git hash-object -t tree /dev/null)
            fi
          fi

          ALTERADOS=$(git diff --name-only "$BASE" "${{ github.sha }}" -- '*.xlsx' '*.xls' '*.csv' | tr '\n' ' ')
          echo "planilhas=$ALTERADOS" >> "$GITHUB_OUTPUT"
          echo "Planilhas alteradas: $ALTERADOS"

      - name: Executar Validador em Cada Planilha Alterada
        if: steps.arquivos.outputs.planilhas != ''
        run: |
          FALHOU=0
          : > relatorio_ci.md

          for arquivo in ${{ steps.arquivos.outputs.planilhas }}; do
            echo "::group::Validando $arquivo"

            CONFIG_ARG=""
            if [ -f "config.json" ]; then
              CONFIG_ARG="--config config.json"
            fi

            validador-planilhas "$arquivo" $CONFIG_ARG --report "relatorio_arquivo.md"
            codigo=$?

            cat "relatorio_arquivo.md" >> relatorio_ci.md
            rm -f relatorio_arquivo.md

            if [ "$codigo" -ge 1 ]; then
              FALHOU=1
            fi
            echo "::endgroup::"
          done

          # Falha o job só depois de validar TODAS as planilhas alteradas
          # (não para na primeira com problema), para o relatório final
          # mostrar todos os problemas de uma vez, não só o primeiro.
          exit $FALHOU

      - name: Planilha Sem Alterações
        if: steps.arquivos.outputs.planilhas == ''
        run: echo "Nenhuma planilha alterada neste push/PR — nada para validar."

      - name: Salvar Relatório como Artefato
        if: always() && steps.arquivos.outputs.planilhas != ''
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-validacao-powerbi
          path: relatorio_ci.md